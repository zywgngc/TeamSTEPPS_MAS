name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/client.txt
      - run: python -m pip install -e .
      - run: python scripts/check_environment.py
      - run: python -m unittest discover -s tests -v
      - run: teamstepps-mas --input examples/synthetic_case.jsonl --methods native_medagents,teamstepps --dry-run
